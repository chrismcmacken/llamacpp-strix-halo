name: Sync upstream/master

# Merges ggml-org/llama.cpp master into this fork's master daily, so the
# nightly chrismcmacken/llamacpp-rocm build (14:00 UTC) picks up fresh
# upstream commits without manual intervention. Cron set 30 min earlier
# than the build to give the merge + any post-push hooks time to settle.
#
# Conflict handling: on a non-clean merge the workflow aborts the merge
# and opens an issue tagging the day's date. No half-merged state is left
# on master. Manual resolution required when that happens.

on:
  schedule:
    - cron: '30 13 * * *'   # 13:30 UTC, 30 min before the rocm build
  workflow_dispatch:

permissions:
  contents: write   # push the merge commit back to master
  issues: write     # open an issue on conflict

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master with full history
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 is required for `git merge` against an external
          # upstream — a shallow clone would refuse to merge unrelated
          # histories. Heavy, but only runs once a day.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git
          git fetch --quiet upstream master

      - name: Check for new upstream commits
        id: check
        run: |
          n=$(git rev-list --count master..upstream/master)
          echo "new_commits=$n" >> "$GITHUB_OUTPUT"
          echo "Upstream has $n new commits since our master HEAD"

      - name: Merge upstream/master
        id: merge
        if: steps.check.outputs.new_commits != '0'
        run: |
          if git merge --no-edit upstream/master; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Push merge to master
        if: steps.merge.outputs.merged == 'true'
        run: git push origin master

      - name: Open issue on merge conflict
        if: failure() && steps.merge.outputs.merged == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream merge conflict on ${today}`,
              body: [
                `Automatic merge of upstream/master into master failed.`,
                ``,
                `Manual resolution required:`,
                ``,
                `\`\`\`bash`,
                `git fetch upstream`,
                `git merge upstream/master`,
                `# resolve conflicts in the listed files`,
                `git push origin master`,
                `\`\`\``,
                ``,
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['upstream-sync'],
            });
